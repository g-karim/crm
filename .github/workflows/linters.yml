name: Linters

on:
    pull_request:
    workflow_dispatch:
        inputs:
            base_ref:
                description: "Base branch for the manual PR comparison"
                required: true
                default: "exp/main2"
                type: string

permissions:
    contents: read
    pull-requests: read

jobs:
    commit-lint:
        name: Semantic Commits
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  check-latest: true

            - name: Install commitlint
              run: npm install --no-save --ignore-scripts @commitlint/cli @commitlint/config-conventional

            - name: Check commit titles
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || format('origin/{0}', inputs.base_ref || 'exp/main2') }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: bash .github/helper/check-commit-titles.sh "$BASE_SHA" "$HEAD_SHA"

    semgrep:
        name: Semgrep Rules
        runs-on: ubuntu-latest

        env:
            PIP_DISABLE_PIP_VERSION_CHECK: "1"
            PYTHONDONTWRITEBYTECODE: "1"

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip

            - name: Install Semgrep
              run: pip install --upgrade semgrep

            - name: Download Semgrep rules
              run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

            - name: Run Semgrep rules
              env:
                  # PR events select their baseline automatically. Give manual runs
                  # the same comparison instead of scanning unrelated legacy code.
                  SEMGREP_BASELINE_REF: ${{ github.event_name == 'workflow_dispatch' && format('origin/{0}', inputs.base_ref || 'exp/main2') || '' }}
              run: semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

    pre-commit:
        name: Pre-commit Checks
        runs-on: ubuntu-latest

        env:
            PIP_DISABLE_PIP_VERSION_CHECK: "1"
            PYTHONDONTWRITEBYTECODE: "1"

        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Install frontend dependencies
              run: cd frontend && yarn install --frozen-lockfile

            - name: Run Pre-commit
              uses: pre-commit/action@v3.0.1
              with:
                  extra_args: --all-files
